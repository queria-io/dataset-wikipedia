$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 1 日ごとの閲覧数の上位 1,000 記事
description: |-
  1 日ごとに人のアクセスの閲覧数が多い 1,000 記事です。記事（標準名前空間）だけで、メインページは除きます。

  - date は UTC の日付です
primary_key: [date, rank]
sources: [pageview_complete]
columns:
  - name: date
    title: 日付
    description: UTC
  - name: rank
    title: 順位
    description: 閲覧数が同じときは page_id の小さい順
  - name: page_id
    title: ページ ID
  - name: title
    title: 記事名
    description: 空白は _
  - name: views
    title: 閲覧数
    description: 人のアクセス
metrics:
  - {name: views, agg: sum, expr: views}
