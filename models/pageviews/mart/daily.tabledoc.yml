$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 1 日ごとの閲覧数
description: |-
  ページごとの 1 日の閲覧数です。1 行が 1 日・1 ページで、人のアクセスの合計とアクセス方法ごとの内訳、bot と判定されたアクセスの数を持ちます。

  - date は UTC の日付です
  - 転送ページ経由の閲覧は転送先のページに含みます
primary_key: [date, page_id]
sources:
  - id: pageview_complete
    path: https://dumps.wikimedia.org/other/pageview_complete/
columns:
  - name: date
    title: 日付
    description: UTC
  - name: page_id
    title: ページ ID
    description: page.page_id
  - name: views
    title: 閲覧数
    description: 人のアクセス
  - name: desktop_views
    title: 閲覧数（PC）
  - name: mobile_web_views
    title: 閲覧数（モバイル Web）
  - name: mobile_app_views
    title: 閲覧数（アプリ）
  - name: automated_views
    title: bot の閲覧数
    description: bot と判定されたアクセス
metrics:
  - {name: views, agg: sum, expr: views}
  - {name: desktop_views, agg: sum, expr: desktop_views}
  - {name: mobile_web_views, agg: sum, expr: mobile_web_views}
  - {name: mobile_app_views, agg: sum, expr: mobile_app_views}
  - {name: automated_views, agg: sum, expr: automated_views}
