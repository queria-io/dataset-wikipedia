version: 2

# hourly と daily は年に数 GB あるので、テストは直近の日だけを見る
models:
- name: page
  description: ページの一覧。1 行が 1 ページ。
  access: public
  columns:
  - name: page_id
    data_tests: [unique, not_null]
  - name: namespace
    data_tests: [not_null]
  - name: title
    data_tests: [not_null]
- name: hourly
  description: 1 時間ごとの閲覧数。1 行が 1 時間・1 ページ・1 アクセス方法・人か bot か。
  access: public
  columns:
  - name: access_method
    data_tests:
    - accepted_values:
        arguments:
          values: [desktop, mobile-web, mobile-app]
        config:
          where: "hour >= current_date - 3"
  - name: agent_type
    data_tests:
    - accepted_values:
        arguments:
          values: [user, automated]
        config:
          where: "hour >= current_date - 3"
- name: daily
  description: 1 日ごとの閲覧数。1 行が 1 日・1 ページ。
  access: public
  columns:
  - name: page_id
    data_tests:
    - not_null:
        config:
          where: "date >= current_date - 3"
- name: daily_top
  description: 1 日ごとの閲覧数の上位 1,000 記事。1 行が 1 日・1 順位。
  access: public
  columns:
  - name: title
    data_tests: [not_null]
