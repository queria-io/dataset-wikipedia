name: Build

# 公開せずにパイプラインと dbt build だけを回す。1 日分の ja.wikipedia の行（約 330 万行）と
# 最新のページの一覧を取って形を確かめる
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import main; main.download_pageviews(None); main.download_page(None)"
        env:
          PAGEVIEWS_DATES: "2026-11-01"
      - run: uv run dbt build --profiles-dir ci
