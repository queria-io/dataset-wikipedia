name: Apply

on:
  push:
    branches: [main]
  # Pageview complete dumps は前日分が 03:00 UTC ごろに出る
  schedule:
    - cron: "0 6 * * *" # 毎日 15:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@f89cad790a98fd7ee528dcdb13cb1b2fb6a8b964
    with:
      dataset_name: wikipedia
      # 1 回に最大 7 日分を取る（1 日分の取得が 3〜4 分）
      timeout_minutes: 60
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
