name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  # Pageview complete dumps は前日分が 03:00 UTC ごろに出る
  schedule:
    - cron: "0 6 * * *" # 毎日 15:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@fe59be721647d5b1bbffe1ef3eb2d318c81be3f3
    with:
      dataset_name: wikipedia
      # 1 回に最大 7 日分を取る（1 日分の取得が 3〜4 分）
      timeout_minutes: 60
    secrets:
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
